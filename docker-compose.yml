services:
  # Chrome with VNC for remote browser access
  chrome-vnc:
    image: browserless/chrome:latest
    container_name: huggingmes-chrome-vnc
    ports:
      - "3000:3000"    # Chrome HTTP API
      - "5900:5900"    # VNC (for visual access)
    environment:
      - CHROME_ENABLED=1
      - MAX_CONCURRENT=1
      - MAX_SESSION_TIMEOUT=3600000
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=16
      - ENABLE_DEBUGGER=1
      - PREVENT_REMOVE=1
      - VNC_PASSWORD=${GATEWAY_TOKEN:-local-dev-token}
    volumes:
      - chrome-data:/data
    restart: unless-stopped

  # HuggingMes (Hermes Agent)
  huggingmes:
    build:
      context: .
      args:
        HERMES_AGENT_VERSION: ${HERMES_AGENT_VERSION:-latest}
    image: huggingmes:local
    ports:
      - "7861:7861"
    environment:
      LLM_MODEL: ${LLM_MODEL:-openrouter/anthropic/claude-sonnet-4}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-local-dev-token}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      HF_TOKEN: ${HF_TOKEN:-}
      SPACE_HOST: ${SPACE_HOST:-localhost:7861}
      # Chrome CDP connection (for Hermes Agent automation)
      BROWSER_CDP_URL: ws://chrome-vnc:3000
      # Browserbase cloud browser (anti-detection + CAPTCHA solving)
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY:-}
      BROWSERBASE_PROJECT_ID: ${BROWSERBASE_PROJECT_ID:-}
      BROWSERBASE_PROXIES: ${BROWSERBASE_PROXIES:-true}
      BROWSERBASE_ADVANCED_STEALTH: ${BROWSERBASE_ADVANCED_STEALTH:-false}
    volumes:
      - huggingmes-data:/opt/data
    depends_on:
      - chrome-vnc

volumes:
  huggingmes-data:
  chrome-data:
