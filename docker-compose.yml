services:
  huggingmes:
    build:
      context: .
      args:
        HERMES_AGENT_VERSION: ${HERMES_AGENT_VERSION:-latest}
    image: huggingmes:local
    ports:
      - "7861:7861"
    environment:
      LLM_MODEL: ${LLM_MODEL:-openrouter/anthropic/claude-sonnet-4}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-local-dev-token}
      HF_TOKEN: ${HF_TOKEN:-}
      SPACE_HOST: ${SPACE_HOST:-localhost:7861}
      # Browserbase cloud browser (optional)
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY:-}
      BROWSERBASE_PROJECT_ID: ${BROWSERBASE_PROJECT_ID:-}
      BROWSERBASE_PROXIES: ${BROWSERBASE_PROXIES:-true}
      BROWSERBASE_ADVANCED_STEALTH: ${BROWSERBASE_ADVANCED_STEALTH:-false}
    volumes:
      - huggingmes-data:/opt/data

volumes:
  huggingmes-data:
